<div class="app">
  <aside class="rail">
    <a class="brand" href="#" aria-label="Magpie Observatory">
      <span class="brand-mark"><svg viewBox="0 0 44 44"><use href="#bird-logo"/></svg></span>
      <span class="brand-text"><b>Magpie</b><small>OBSERVATORY</small></span>
    </a>
    <nav class="rail-nav" aria-label="主导航">
      <button class="nav-item active" data-view="overview" title="总览"><svg><use href="#i-overview"/></svg><span>总览</span></button>
      <button class="nav-item" data-view="routing" title="实时路由"><svg><use href="#i-route"/></svg><span>路由</span></button>
      <button class="nav-item" data-view="usage" title="用量"><svg><use href="#i-chart"/></svg><span>用量</span></button>
      <button class="nav-item" data-view="sessions" title="会话"><svg><use href="#i-stack"/></svg><span>会话</span></button>
      <button class="nav-item" data-view="providers" title="服务商"><svg><use href="#i-server"/></svg><span>服务商</span></button>
      <button class="nav-item" id="replay-toggle" title="回放最近3分钟"><svg><use href="#i-clock"/></svg><span>回放</span></button>
    </nav>
    <div class="rail-favs" id="rail-favs" hidden aria-label="收藏的视图"></div>
    <div class="rail-foot">
      <button class="nav-item" id="theme-toggle" title="明暗模式"><svg class="icon-moon"><use href="#i-moon"/></svg><svg class="icon-sun"><use href="#i-sun"/></svg><span>明暗</span></button>
      <button class="nav-item" id="style-toggle" title="界面风格"><svg><use href="#i-palette"/></svg><span>风格</span></button>
      <button class="nav-item" id="settings-toggle" title="布局与动效"><svg><use href="#i-settings"/></svg><span>设置</span></button>
      <div class="rail-version">v1.10.125 <i></i> plugin</div>
    </div>
  </aside>

  <div class="shell">
    <header class="topbar">
      <div class="crumb">
        <span class="live-dot" id="live-dot"></span>
        <strong>实时总览</strong>
        <span class="crumb-sep">/</span>
        <span class="crumb-sub">All agents, one gateway</span>
      </div>
      <div class="top-actions">
        <button class="conn" id="conn-pill" data-mode="demo" title="点击切换数据源">
          <span class="conn-dot"></span>
          <span id="conn-label">演示数据</span>
          <span class="conn-host" id="conn-host">mock://local</span>
        </button>
        <button class="xp-chip" id="xp-chip" title="等级与经验 · 点击看战绩">
          <svg class="xp-ring" viewBox="0 0 36 36"><circle class="xp-ring-bg" cx="18" cy="18" r="15.5"/><circle class="xp-ring-fill" id="xp-ring-fill" cx="18" cy="18" r="15.5"/></svg>
          <span class="xp-copy"><b id="xp-level">Lv 0</b><small id="xp-name">观测员</small></span>
        </button>
        <div class="seg" id="range-seg" role="group" aria-label="时间范围">
          <button data-range="today" class="active">今天</button>
          <button data-range="7d">7 天</button>
          <button data-range="30d">30 天</button>
        </div>
        <button class="icon-btn" id="demo-toggle" title="暂停 / 继续实时演示" aria-label="暂停实时演示"><svg><use href="#i-pause"/></svg></button>
        <button class="icon-btn" id="refresh" title="刷新" aria-label="刷新"><svg><use href="#i-refresh"/></svg></button>
        <button class="icon-btn" id="cmd-open" title="命令面板（⌘K）" aria-label="命令面板"><svg><use href="#i-cmd"/></svg></button>
      </div>
    </header>

    <main class="grid" id="grid">
      <!-- 实时路由 -->
      <section class="card hero" data-slot="hero" aria-labelledby="hero-title">
        <div class="card-head hero-head">
          <div>
            <div class="eyebrow"><span class="live-ring"></span> LIVE ROUTING</div>
            <h1 id="hero-title">实时路由</h1>
          </div>
          <div class="hero-meta">
            <button class="view-picker" id="view-picker" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="view-menu" title="切换视图（V）">
              <span class="vp-ic" id="vp-ic"><svg><use href="#i-route"/></svg></span>
              <span class="vp-copy"><b id="vp-title">实时路由</b><small id="vp-eyebrow">LIVE ROUTING</small></span>
              <svg class="vp-chevron"><use href="#i-chevron"/></svg>
            </button>
            <button class="cinema-btn" id="cinema-toggle" type="button" title="影院模式（O）· 全屏只看这一个视图" aria-label="进入影院模式"><svg><use href="#i-expand"/></svg></button>
            <button class="cinema-btn" id="export-png" type="button" title="导出当前视图 PNG（E）" aria-label="导出 PNG"><svg><use href="#i-download"/></svg></button>
            <div class="hero-stat"><b id="hero-requests">0</b><span>请求</span></div>
