<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Magpie Observatory</title>
<style>
  :root { color-scheme: dark light; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    background: var(--magpie-bg, #0b0c12);
    color: var(--magpie-fg, #eef1f8);
    font: 13px/1.5 var(--magpie-font, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif);
  }
  .box { max-width: 440px; padding: 24px; text-align: center; }
  img { width: 64px; height: 64px; margin-bottom: 12px; }
  b { display: block; font-size: 16px; margin-bottom: 6px; }
  p { margin: 4px 0; color: var(--magpie-muted, #8b93a7); }
  button {
    margin-top: 12px; padding: 5px 16px; font: inherit; cursor: pointer;
    color: var(--magpie-fg, #eef1f8); background: var(--magpie-card, #151823);
    border: 1px solid var(--magpie-line, #2a3040); border-radius: 7px;
  }
  button[hidden] { display: none; }
</style>
</head>
<body>
  <div class="box">
    <img src="icon.svg" alt="">
    <b>Magpie Observatory</b>
    <p id="said">正在连接本地观测台服务…</p>
    <button id="retry" type="button" hidden>重试</button>
  </div>
  <script src="_magpie/bridge.js"></script>
  <script src="boot.js"></script>
</body>
</html>
