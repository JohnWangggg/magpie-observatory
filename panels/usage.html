<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<link rel="stylesheet" href="usage.css">
<script src="_magpie/bridge.js"></script>
<script src="usage.js" defer></script>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="title"><span class="dot"></span><b data-t="title">今日一眼</b></div>
      <span class="sub" data-t="sub">对比近 7 天日均</span>
    </header>
    <div class="tiles">
      <div class="tile"><span data-t="tokens">Token</span><b id="tokens">—</b><small id="tokens-d">—</small></div>
      <div class="tile"><span data-t="cost">费用</span><b id="cost">—</b><small id="cost-d">—</small></div>
      <div class="tile"><span data-t="calls">调用</span><b id="calls">—</b><small id="calls-d">—</small></div>
      <div class="tile"><span data-t="errors">错误</span><b id="errors">—</b><small id="errors-d">—</small></div>
    </div>
    <div class="foot">
      <span id="top">—</span>
      <span id="status" class="status"></span>
    </div>
  </div>
</body>
</html>
